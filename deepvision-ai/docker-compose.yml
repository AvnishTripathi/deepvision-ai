name: deepvision-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: deepvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deepvision_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deepvision_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deepvision-network

  redis:
    image: redis:7-alpine
    container_name: deepvision-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deepvision-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepvision-backend
    restart: unless-stopped
    environment:
      - APP_NAME=DeepVision AI
      - APP_VERSION=0.1.0
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/deepvision_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
      - LOG_LEVEL=INFO
      - AI_DEVICE=auto
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    networks:
      - deepvision-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepvision-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - deepvision-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  deepvision-network:
    driver: bridge
